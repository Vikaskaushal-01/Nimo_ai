# Production-style stack: one public port (the frontend), which serves the SPA
# and reverse-proxies /api to the backend. MongoDB, Redis and the backend are
# reachable only on the internal compose network.
#
#   docker compose up -d --build     →  http://localhost:${FRONTEND_PORT:-5173}
#
# Requires strong JWT_ACCESS_SECRET / JWT_REFRESH_SECRET in .env (the backend
# refuses to start in production with the dev defaults).

services:
  mongo:
    image: mongo:7
    container_name: mai_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mai_redis
    restart: unless-stopped
    # Pure cache: bounded memory, evict least-recently-used keys, no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mai_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Compose-internal hostnames override the localhost values in .env.
      MONGO_URI: mongodb://mongo:27017/multi_ai
      REDIS_URL: redis://redis:6379
      BACKEND_PORT: 4000
      # Requests arrive through the frontend's nginx proxy.
      TRUST_PROXY: 1
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mai_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
